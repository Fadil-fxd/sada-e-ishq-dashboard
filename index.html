function drawDonut(a){var d=a.filter(function(r){return r.life==='confirmed'||r.life==='completed'}),m={};d.forEach(function(r){m[r.type]=(m[r.type]||0)+r.income});var rs=Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]}),total=rs.reduce(function(t,x){return t+x[1]},0),angle=0,colors=['#efc76c','#9a7740','#6a522e','#45391f'];if(!$('donut'))return;var stops=rs.map(function(x,i){var st=angle,en=angle+(total?x[1]/total*360:0);angle=en;return colors[i%colors.length]+' '+st+'deg '+en+'deg'}).join(',')||'#45391f 0deg 360deg';$('donut').style.background='conic-gradient('+stops+')';$('donutPct').textContent=total&&rs.length?Math.round(rs[0][1]/total*100)+'%':'0%';$('legend').innerHTML=rs.slice(0,5).map(function(x){return'<div class="legendRow"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>'}).join('')||'<div class="legendRow"><span>No data</span><b>—</b></div>'}
function render(){nav();fillFilters();var a=filtered();$('pageTitle').textContent=state.view==='programs'?(state.tab?state.tab.charAt(0).toUpperCase()+state.tab.slice(1):'Programs'):state.view.charAt(0).toUpperCase()+state.view.slice(1);$('pageDate').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('error').innerHTML=state.error?'<div class="errorBox"><span>'+esc(state.error)+'</span><button class="button" data-retry="1">Retry</button></div>':'';var html='';if(state.view==='overview')html=overview(a);else if(state.view==='programs'||state.view==='enquiries'||state.view==='confirmed'||state.view==='completed'){if(state.view!=='programs')state.tab=state.view==='enquiries'?'enquiry':state.view;html=programs(a)}else if(state.view==='upcoming'){html=upcomingBlock(a)}else if(state.view==='finance')html=finance(a);else if(state.view==='analytics')html=analytics(a);else if(state.view==='admin')html=admin();$('content').innerHTML=html;$('addBtn').style.display=state.admin?'inline-flex':'none';if(state.view==='admin')$('addBtn').style.display='none';document.title='Sada-e-Ishq — '+($('pageTitle').textContent||'Band OS');setTimeout(function(){drawChart(a);drawDonut(a)},0)}
var search=$('search');search.oninput=function(){state.filters.q=search.value;render()};$('filterToggle').onclick=function(){$('filters').classList.toggle('show')};document.addEventListener('change',function(e){if(e.target&&e.target.dataset&&e.target.dataset.filter){state.filters[e.target.dataset.filter]=e.target.value;render()}});document.addEventListener('click',function(e){var v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;state.tab='';render()}var t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;state.view='programs';render()}var ed=e.target.closest('[data-edit]');if(ed)programModal(ed.dataset.edit);var de=e.target.closest('[data-delete]');if(de)confirmDelete(de.dataset.delete);var ad=e.target.closest('[data-add]');if(ad)programModal();var out=e.target.closest('[data-logout]');if(out)logout();var retry=e.target.closest('[data-retry]');if(retry)load()});
$('addBtn').onclick=function(){programModal()}; 
async function load(){setConnection(false,'Loading data');try{var data=await api('/rest/v1/programs?select=*&order=program_date.asc');if(Array.isArray(data)){state.rows=data.map(viewRow);state.loaded=true;state.live=true;setConnection(true,'Live data');state.error='';render();return}}catch(e){state.error=e.message}state.loaded=true;setConnection(false,'Offline • seed data');render()}
async function login(){var em=$('loginEmail').value.trim().toLowerCase(),pw=$('loginPassword').value;if(em!==ADMIN_EMAIL){$('loginError').textContent='Admin access is restricted to the authorized account.';return}if(!pw){$('loginError').textContent='Enter your password.';return}try{var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})}),d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Sign in failed');state.token=d.access_token;state.admin=true;state.userId=d.user&&d.user.id?d.user.id:'';render();toast('Signed in ✓')}catch(e){$('loginError').textContent=e.message}}
async function logout(){state.admin=false;state.token='';state.userId='';render();toast('Signed out ✓')}
var SUPPORTED_B64=''; 
render();load();setInterval(load,30000);
