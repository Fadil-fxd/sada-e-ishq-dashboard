async function saveProgram(editCode){const payload={program_code:$('pCode').value.trim(),program_date:$('pDate').value,event_type:$('pEvent').value.trim(),place:$('pPlace').value.trim(),program_type:$('pType').value,booking_source:$('pSource').value,income:+$('pIncome').value||0,expense:+$('pExpense').value||0,advance_received:+$('pAdvance').value||0,program_status:$('pStatus').value,contact_name:$('pName').value.trim()||null,contact_phone:$('pPhone').value.trim()||null,notes:$('pNotes').value.trim()||null,balance_to_collect:Math.max((+$('pIncome').value||0)-(+$('pAdvance').value||0),0),updated_by:(await sb.auth.getUser()).data.user?.id||null};if(!payload.program_code||!payload.program_date||!payload.event_type||!payload.place||!payload.program_type)return setFormError('Complete Program ID, date, event, place and type.');if(payload.advance_received>payload.income)return setFormError('Advance cannot be greater than income.');if(editCode){const current=state.rows.find(x=>x.code===editCode);if(current?.updated_at&&current.updated_at!==state.rows.find(x=>x.code===editCode)?.updated_at){}const res=await sb.from('programs').update(payload).eq('program_code',editCode);if(res.error)return setFormError(res.error.message)}else{const res=await sb.from('programs').insert(payload);if(res.error)return setFormError(res.error.message)}closeModal();await load()}
function setFormError(m){let e=$('formError');if(!e){$('programForm').insertAdjacentHTML('afterend','<div class="error" id="formError"></div>');e=$('formError')}e.textContent=m}
function openDelete(code){const r=state.rows.find(x=>x.code===code);if(!state.admin||!r)return;const mustType=Boolean(r.income||r.advance||r.expense||['confirmed','completed'].includes(r.status));openModal('<div class="dialog"><div class="label">DELETE PROGRAM</div><div class="section-title" style="margin-top:5px">Are you sure to delete this event?</div><div class="section-note">The record will be permanently removed from Programs. A server-side audit copy is created before deletion.</div><div style="display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:12px"><span class="section-note">Program</span><b>'+esc(r.code)+'</b><span class="section-note">Event</span><b>'+esc(r.event)+'</b><span class="section-note">Place</span><b>'+esc(r.place)+'</b><span class="section-note">Date</span><b>'+esc(fmtLong(r.date))+'</b></div>'+(mustType?'<div class="notice">Because this program has financial or confirmed/completed history, type <b>'+esc(r.code)+'</b> to confirm.</div><div class="field" style="margin-top:8px"><label>Type Program ID</label><input id="deleteConfirmInput" autocomplete="off"></div>':'')+'<div class="dialog-actions"><button class="btn" id="deleteCancel">No, keep it</button><button class="btn danger" id="deleteYes">Yes, delete</button></div></div>');$('deleteCancel').onclick=closeModal;$('deleteYes').onclick=async()=>{if(mustType&&$('deleteConfirmInput').value.trim()!==r.code)return alert('Type the Program ID exactly to confirm.');$('deleteYes').disabled=true;$('deleteYes').textContent='Deleting…';const res=await sb.from('programs').delete().eq('program_code',r.code);if(res.error){$('deleteYes').disabled=false;$('deleteYes').textContent='Yes, delete';return alert(res.error.message)}closeModal();await load();toast('Program deleted. Audit copy saved.');}}
async function showAudit(){if(!state.admin)return;const {data,error}=await sb.from('program_audit').select('*').eq('action','DELETE').order('changed_at',{ascending:false}).limit(20);if(error)return alert(error.message);openModal('<div class="dialog"><div class="section-title">Recently deleted</div><div class="section-note">Server-side audit copies available to admin.</div><div class="schedule">'+(data?.length?data.map(x=>'<div class="schedule-row"><strong>'+new Date(x.changed_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+'</strong><div><b>'+esc(x.program_code)+'</b><span>'+esc(x.old_row?.event_type||'Program')+' • '+esc(x.old_row?.place||'')+'</span></div><button class="btn" data-restore="'+x.id+'">Restore</button></div>').join(''):'<div class="empty"><div><b>No deleted records</b></div></div>')+'</div><div class="dialog-actions"><button class="btn" data-close>Close</button></div></div>');$('modal').querySelector('[data-close]').onclick=closeModal;$('modal').querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreAudit(b.dataset.restore))}
async function restoreAudit(aid){const {data,error}=await sb.from('program_audit').select('*').eq('id',aid).maybeSingle();if(error||!data?.old_row)return alert(error?.message||'Audit row not found.');const row={...data.old_row};delete row.id;delete row.created_at;delete row.updated_at;const res=await sb.from('programs').insert(row);if(res.error)return alert(res.error.message);closeModal();await load();toast('Program restored.')}
function toast(m){const n=document.createElement('div');n.textContent=m;n.style.cssText='position:fixed;right:14px;bottom:14px;z-index:500;background:#171b22;border:1px solid #4c3d26;border-radius:12px;padding:10px 12px;color:#f0d69a;font-size:10px;box-shadow:0 18px 45px rgba(0,0,0,.4)';document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function exportRows(kind){if(!state.admin)return;const rows=state.rows.map(r=>({Program_ID:r.code,Date:r.date,Event_Type:r.event,Place:r.place,Program_Type:r.type,Booking_Source:r.source,Income:r.income,Expense:r.expense,Profit:r.profit,Advance_Received:r.advance,Balance_To_Collect:r.balance,Status:r.status,Client_Name:r.name,Contact_Phone:r.phone,Notes:r.notes})),stamp=today(),name='Sada-e-Ishq-Backup-'+stamp; if(kind==='json'){download(new Blob([JSON.stringify({exported_at:new Date().toISOString(),row_count:rows.length,schema_version:1,records:rows},null,2)],{type:'application/json'}),name+'.json');return}if(kind==='csv'){const cols=Object.keys(rows[0]||{Program_ID:''}),csv='\ufeff'+[cols.join(','),...rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))].join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),name+'.csv');return}if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Programs');const summary=[['Sada-e-Ishq Backup'],['Exported at',new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})],['Rows',rows.length],['Source','Supabase programs']];const sw=XLSX.utils.aoa_to_sheet(summary);XLSX.utils.book_append_sheet(wb,sw,'Summary');XLSX.writeFile(wb,name+'.xlsx')}else exportRows('csv')}
function csvCell(v){const s=String(v??'');return'"'+s.replace(/"/g,'""')+'"'}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)}
function drawChart(){const c=$('chart');if(!c)return;const a=filtered().filter(r=>['completed','confirmed'].includes(lifecycle(r))),m={};a.forEach(r=>{const k=r.date.slice(0,7);m[k]=(m[k]||0)+r.income});const d=Object.keys(m).sort().map(k=>({k,v:m[k]})),box=c.getBoundingClientRect(),ratio=devicePixelRatio||1,w=Math.max(280,box.width),h=Math.max(180,box.height);c.width=w*ratio;c.height=h*ratio;const x=c.getContext('2d');x.setTransform(ratio,0,0,ratio,0,0);x.clearRect(0,0,w,h);if(!d.length)return;const p={l:45,r:14,t:18,b:30},iw=w-p.l-p.r,ih=h-p.t-p.b,max=Math.max(1,...d.map(z=>z.v)),pts=d.map((z,i)=>({x:p.l+(d.length===1?iw/2:i*iw/(d.length-1)),y:p.t+ih-z.v/max*ih}));x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;for(let i=0;i<5;i++){const y=p.t+i*ih/4;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke()}x.fillStyle='#717983';x.font='9px Inter,system-ui';x.textAlign='center';d.forEach((z,i)=>{if(i===0||i===d.length-1||i%Math.max(1,Math.ceil(d.length/6))===0)x.fillText(new Date(z.k+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short'}),pts[i].x,h-8)});x.strokeStyle='#efc567';x.lineWidth=3;x.lineCap='round';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();pts.forEach(p=>{x.fillStyle='#0b0c0e';x.strokeStyle='#efc567';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,4,0,Math.PI*2);x.fill();x.stroke()})}
function drawDonut(){const d=filtered().filter(r=>['completed','confirmed'].includes(lifecycle(r))),m={};d.forEach(r=>m[r.type]=(m[r.type]||0)+r.income);const rs=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=rs.reduce((a,x)=>a+x[1],0);let angle=0;const cols=['#efc567','#9a7740','#65502e','#42351f'];if($('donut')){$('donut').style.background='conic-gradient('+rs.map((r,i)=>{const end=angle+(tot?r[1]/tot*360:0),s=cols[i%cols.length]+' '+angle+'deg '+end+'deg';angle=end;return s}).join(',')+')';$('donutPct').textContent=tot&&rs.length?Math.round(rs[0][1]/tot*100)+'%':'0%';$('legend').innerHTML=rs.slice(0,6).map(r=>'<div class="legend-row"><span>'+esc(r[0])+'</span><b>'+money(r[1])+'</b></div>').join('')||'<div class="legend-row"><span>No data</span><b>—</b></div>'}}
function render(){setNav();renderFilters();const a=filtered();$('pageTitle').textContent=state.view==='programs'?(state.tab?statusLabel(state.tab):'Programs'):state.view==='upcoming'?'Upcoming programs':state.view.charAt(0).toUpperCase()+state.view.slice(1);$('pageSub').textContent=state.error?'Offline snapshot • '+(state.snapshotAt?new Date(state.snapshotAt).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}):'No saved snapshot'):'Your live band operations command center';$('topAdd').style.display=state.admin?'inline-flex':'none';let html='';if(state.view==='overview')html=overview(a);else if(state.view==='upcoming')html=upcomingPage(a);else if(['programs','enquiries','confirmed','completed'].includes(state.view)){if(state.view!=='programs')state.tab=state.view==='enquiries'?'enquiry':state.view;html=programsPage(a)}else if(state.view==='finance')html=financePage(a);else if(state.view==='analytics')html=analyticsPage(a);else html=adminPage();$('globalError').innerHTML=state.error&&state.live===false?'<div class="error">'+esc(state.error)+' <button class="btn" id="retry" style="margin-left:7px">Retry now</button></div>':'';$('content').innerHTML=html;bind();setTimeout(()=>{drawChart();drawDonut()},0)}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{});document.querySelectorAll('[data-open-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.openView;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.view='programs';render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openEditor());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>openDelete(b.dataset.delete));document.querySelector('[data-logout]')?.addEventListener('click',async()=>{await sb.auth.signOut();state.admin=false;render()});document.querySelector('[data-audit]')?.addEventListener('click',showAudit);document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportRows(b.dataset.export));document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreAudit(b.dataset.restore));$('retry')?.addEventListener('click',load);$('login')?.addEventListener('click',login);$('filterToggle').onclick=()=>$('filters').classList.toggle('show');$('topAdd').onclick=()=>openEditor();document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{closeMore();state.view=b.dataset.more;render()})}
async function login(){const email=$('loginEmail').value.trim().toLowerCase(),password=$('loginPassword').value;if(email!==ADMIN_EMAIL)return $('loginError').innerHTML='<div class="error">Use the authorized admin email.</div>';if(!password)return $('loginError').innerHTML='<div class="error">Enter your password.</div>';const b=$('login');b.disabled=true;b.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password});if(error) $('loginError').innerHTML='<div class="error">'+esc(error.message)+'</div>';else state.admin=true; b.disabled=false;b.textContent='Sign in';render()}
$('search').oninput=e=>{state.q=e.target.value;render()};$('filterToggle').onclick=()=>$('filters').classList.toggle('show');$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};sb.auth.getSession().then(({data:{session}})=>{state.admin=session?.user?.email?.toLowerCase()===ADMIN_EMAIL;load()});sb.auth.onAuthStateChange((_event,session)=>{state.admin=session?.user?.email?.toLowerCase()===ADMIN_EMAIL;render()});sb.channel('programs-live').on('postgres_changes',{event:'*',schema:'public',table:'programs'},()=>load()).subscribe();readSnapshot();render();setInterval(()=>{if(!navigator.onLine)state.error=state.snapshotAt?'Offline: showing saved data.':'';},1000);
})();
