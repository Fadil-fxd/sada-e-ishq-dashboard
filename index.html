async function openArtistModal(id=''){

 openOverlay('<div class="modal"><div class="modal-head"><div><div class="modal-title">'+(editing?'Edit artist':'Add artist')+'</div><div class="modal-note">'+(editing?'Update the artist profile.':'Create a Supabase login and artist profile.')+'</div></div><button class="btn icon" data-close-overlay>×</button></div><div class="form"><div class="field"><label>Display name</label><input id="artistName" value="'+esc(p?.display_name||'')+'"></div><div class="field"><label>Instrument</label><input id="artistInstrument" value="'+esc(p?.instrument||'')+'"></div><div class="field"><label>Phone</label><input id="artistPhone" value="'+esc(p?.phone||'')+'"></div><div class="field"><label>Status</label><select id="artistActive"><option value="true" '+(p?.active!==false?'selected':'')+'>Active</option><option value="false" '+(p?.active===false?'selected':'')+'>Inactive</option></select></div>'+(editing?'':'<div class="field wide"><label>Login email</label><input id="artistEmail" type="email" placeholder="artist@example.com"></div><div class="field wide"><label>Temporary password</label><input id="artistPassword" type="password" minlength="6" placeholder="Minimum 6 characters"></div>')+'</div><div id="artistModalErr" class="error-text" style="margin-top:9px"></div><div class="modal-foot"><button class="btn" data-close-overlay>Cancel</button><button class="btn primary" id="saveArtistBtn">'+(editing?'Save changes':'Create artist')+'</button></div></div>','artist');
 $('saveArtistBtn').onclick=async()=>{
  const name=$('artistName').value.trim(),instrument=$('artistInstrument').value.trim(),phone=$('artistPhone').value.trim(),active=$('artistActive').value==='true';
  if(!name){$('artistModalErr').textContent='Display name is required.';return}
  const btn=$('saveArtistBtn');btn.disabled=true;btn.textContent=editing?'Saving…':'Creating…';
  try{
   if(editing){
    const {error}=await sb.from('profiles').update({display_name:name,instrument,phone,active,updated_at:new Date().toISOString()}).eq('id',id);
    if(error)throw error;closeOverlay();toast('Artist profile updated');await renderArtists();return;
   }
   const email=$('artistEmail').value.trim().toLowerCase(),password=$('artistPassword').value;
   if(!email||password.length<6)throw new Error('Enter a valid email and a password with at least 6 characters.');
   const provisioning=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'sei-provision-'+Date.now()}});

   closeOverlay();toast('Artist account created');await renderArtists();
  }catch(e){$('artistModalErr').textContent=e.message||'Unable to save artist.';btn.disabled=false;btn.textContent=editing?'Save changes':'Create artist'}
 };
}

    const time=String(p.program_time||'10:00').slice(0,5).replace(':','');
    const hh=Number(time.slice(0,2)||10),mm=time.slice(2)||'00';
    const endH=Math.min(hh+3,23);
    const start=date+'T'+String(hh).padStart(2,'0')+mm+'00';
    const end=date+'T'+String(endH).padStart(2,'0')+mm+'00';
    const title='Sada-e-Ishq — '+(p.event_type||'Program');
    const details='THE VOICE OF LOVE\\nProgram: '+(p.program_code||'')+'\\nVenue: '+(p.place||'')+'\\nGoogle Maps: '+(p.maps_url||'');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      +'&text='+encodeURIComponent(title)
      +'&dates='+start+'/'+end
      +'&ctz=Asia%2FKolkata'
      +'&details='+encodeURIComponent(details)
      +'&location='+encodeURIComponent(p.place||'');
  }

  function ics(p){
    const date=String(p.program_date||'').replaceAll('-','');
    const time=String(p.program_time||'10:00').slice(0,5).replace(':','');
    const hh=Number(time.slice(0,2)||10),mm=time.slice(2)||'00';
    const endH=Math.min(hh+3,23);
    const start=date+'T'+String(hh).padStart(2,'0')+mm+'00';
    const end=date+'T'+String(endH).padStart(2,'0')+mm+'00';
    return [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sada-e-Ishq//Operations OS//EN',
      'CALSCALE:GREGORIAN','BEGIN:VEVENT',
      'UID:'+encodeURIComponent(p.program_code||Date.now())+'@sadaeishq',
      'DTSTART;TZID=Asia/Kolkata:'+start,'DTEND;TZID=Asia/Kolkata:'+end,
      'SUMMARY:Sada-e-Ishq — '+String(p.event_type||'Program').replace(/[\\r\\n;]/g,' '),
      'LOCATION:'+String(p.place||'').replace(/[\\r\\n;]/g,' '),
      'URL:'+String(p.maps_url||''),
      'DESCRIPTION:THE VOICE OF LOVE\\nProgram: '+String(p.program_code||'').replace(/[\\r\\n;]/g,' '),
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Sada-e-Ishq program tomorrow','END:VALARM',
      'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Sada-e-Ishq soundcheck in 2 hours','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
  }

  function downloadICS(p){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([ics(p)],{type:'text/calendar;charset=utf-8'}));
    a.download=(p.program_code||'sada-e-ishq-program')+'.ics';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800);
  }

  async function scheduleReminders(p){
    try{
      const {data:admins}=await sb.from('profiles').select('id').eq('role','admin').eq('active',true);
      if(!admins?.length||!p.id||!p.program_date)return;
      await sb.from('program_reminders').delete().eq('program_id',p.id).eq('audience','admin');
      const base=new Date(p.program_date+'T'+String(p.program_time||'10:00').slice(0,5)+':00+05:30');
      const rows=[{mins:1440,kind:'program_1d'},{mins:120,kind:'soundcheck_2h'}]
        .map(x=>({program_id:p.id,recipient_id:admins[0].id,audience:'admin',due_at:new Date(base.getTime()-x.mins*60000).toISOString(),kind:x.kind,status:'scheduled'}))
        .filter(x=>new Date(x.due_at)>new Date());
      if(rows.length) await sb.from('program_reminders').insert(rows);
    }catch(e){console.warn('Reminder scheduling skipped',e)}
  }

  function showCalendarActions(p){
    const title='Calendar automation ready';
    openOverlay('<div class="modal confirm"><div class="modal-head"><div><div class="eyebrow">PROGRAM AUTOMATION</div><div class="modal-title" style="margin-top:5px">'+esc2(title)+'</div><div class="modal-note">Google Calendar event, Google Maps place and .ics reminders are ready for '+esc2(p.program_code||'this program')+'.</div></div><button class="btn icon" data-close-overlay>×</button></div><div class="delete-summary"><span>Venue</span><b>'+esc2(p.place)+'</b><span>Date</span><b>'+esc2(p.program_date)+'</b><span>Time</span><b>'+esc2(p.program_time||'10:00')+'</b></div><div class="modal-foot" style="flex-wrap:wrap"><button class="btn" id="seiOpenMaps">Open Google Maps</button><button class="btn" id="seiDownloadICS">Download .ics</button><button class="btn primary" id="seiOpenCalendar">Add to Google Calendar</button></div></div>','calendar-actions');
    $('seiOpenMaps').onclick=()=>window.open(p.maps_url||mapsUrl(p.place),'_blank','noopener');
    $('seiDownloadICS').onclick=()=>downloadICS(p);
    $('seiOpenCalendar').onclick=()=>window.open(calendarUrl(p),'_blank','noopener');
  }

  async function configureMaps(){
    const existing=await getKey();
    openOverlay('<div class="modal confirm"><div class="modal-head"><div><div class="eyebrow">GOOGLE PLACES</div><div class="modal-title" style="margin-top:5px">Connect Google Maps Places</div><div class="modal-note">Paste a Google Maps Platform browser key with Places API (New) enabled and restrict it to this Render domain.</div></div><button class="btn icon" data-close-overlay>×</button></div><div class="field" style="margin-top:14px"><label for="seiMapsKey">Browser API key</label><input id="seiMapsKey" type="password" autocomplete="off" value="'+esc2(existing)+'" placeholder="AIza..."></div><div id="seiMapsKeyErr" class="error-text" style="margin-top:8px"></div><div class="modal-foot"><button class="btn" data-close-overlay>Cancel</button><button class="btn primary" id="seiSaveMapsKey">Save & connect</button></div></div>','maps-key');
    $('seiSaveMapsKey').onclick=async()=>{
      const key=$('seiMapsKey').value.trim();
      if(!key){$('seiMapsKeyErr').textContent='Enter the Google Maps browser key.';return}
      const b=$('seiSaveMapsKey');b.disabled=true;b.textContent='Connecting…';
      try{await saveKey(key);googleReady=null;await loadGoogle();if(!window.google?.maps?.importLibrary)throw Error('Google Maps could not load. Check the key, APIs and HTTP referrer restrictions.');closeOverlay();toast('Google Places connected');}
      catch(e){$('seiMapsKeyErr').textContent=e.message||'Unable to connect Google Maps.';b.disabled=false;b.textContent='Save & connect'}
    };
  }

  async function mountPlacePicker(){
    const input=document.getElementById('pPlace');
    if(!input||input.dataset.googlePlaceMounted)return;
    input.dataset.googlePlaceMounted='1';
    const r=window.__seiEditRow;
    const wrap=input.parentElement;
    const status=document.createElement('div');
    status.id='seiPlaceStatus';
    status.className='section-note';
    status.style='margin-top:5px';
    status.textContent='Google Maps place selection required';
    wrap.appendChild(status);

    const ok=await loadGoogle();
    if(!ok){
      status.innerHTML='<span style="color:#e8c77b">Google Places is not connected.</span> <button type="button" class="btn small" id="seiConfigureMaps">Connect Google Maps</button>';
      $('seiConfigureMaps').onclick=async()=>{await configureMaps();setTimeout(()=>mountPlacePicker(),150)};
      input.placeholder='Connect Google Maps to search venues';
      input.readOnly=true;
      return;
    }

    const {PlaceAutocompleteElement}=await google.maps.importLibrary('places');
    const picker=new PlaceAutocompleteElement();
    picker.placeholder='Search Google Maps places…';
    picker.includedRegionCodes=['in'];
    picker.style.display='block';
    picker.style.width='100%';
    picker.style.marginTop='2px';

    input.style.display='none';
    wrap.insertBefore(picker,input);
    if(r?.place){
      status.textContent='Select the Google Maps result again to verify this venue.';
      window.__seiSelectedPlace=null;
    }
    picker.addEventListener('gmp-select',async(ev)=>{
      try{
        const place=ev.placePrediction.toPlace();
        await place.fetchFields({fields:['displayName','formattedAddress','location']});
        const name=place.displayName||place.formattedAddress||'';
        input.value=name;
        window.__seiSelectedPlace={id:place.id,name,formattedAddress:place.formattedAddress||name,location:place.location,maps_url:mapsUrl(name,place.id)};
        status.innerHTML='<span style="color:#78c095">✓ Google Maps place selected</span> · <button type="button" class="btn small" id="seiOpenSelectedMap">Open map</button>';
        $('seiOpenSelectedMap').onclick=()=>window.open(window.__seiSelectedPlace.maps_url,'_blank','noopener');
        state.modal.dirty=true;
      }catch(e){status.textContent='Could not read the selected Google Maps place.'}
    });
  }

  const originalOpen=window.openProgramModal;
  window.openProgramModal=async function(key=''){
    window.__seiSelectedPlace=null;
    window.__seiEditRow=key&&typeof programByKey==='function'?programByKey(key):null;
    originalOpen(key);
    setTimeout(()=>{mountPlacePicker()},80);
  };

  const originalSave=window.saveProgram;
  window.saveProgram=async function(key){
    const placeInput=document.getElementById('pPlace');
    const selected=window.__seiSelectedPlace;
    const existing=window.__seiEditRow;
    const code=placeInput?.value?.trim()||existing?.program_code||'';
    const programTime=document.getElementById('seiProgramTime')?.value||existing?.program_time||'10:00';
    if(!selected){
      $('formError').textContent=existing?.maps_url
        ? 'Please select this venue from Google Maps again before saving.'
        : 'Select a venue from the Google Maps suggestions. Manual place names are not allowed.';
      return;
    }
    await originalSave(key);
    const errorText=$('formError')?.textContent?.trim()||'';
    if(errorText||!code)return;
    try{
      const {data:row,error}=await sb.from('programs').select('*').eq('program_code',code).maybeSingle();
      if(error||!row)throw error||new Error('Saved program could not be reloaded.');
      const finalPlace=selected.formattedAddress||selected.name;
      const {error:updateError}=await sb.from('programs').update({
        place:finalPlace,
        maps_url:selected.maps_url,
        program_time:programTime||null,
        alt_phone:document.getElementById('pPhone')?.value?.trim()||null
      }).eq('id',row.id);
      if(updateError)throw updateError;
      const finalProgram={...row,place:finalPlace,maps_url:selected.maps_url,program_time:programTime||null};
      await scheduleReminders(finalProgram);
      await fetchPrograms(true);
      showCalendarActions(finalProgram);
    }catch(e){console.warn('Calendar automation post-save failed',e);toast('Program saved, but calendar automation needs attention','err')}
  };

  const oldAdmin=window.renderAdmin;
  window.renderAdmin=async function(){
    if(typeof oldAdmin==='function')await oldAdmin();
    if(state.auth.role==='admin' && document.querySelector('.admin-hero-actions') && !document.getElementById('seiMapsSetupBtn')){
      const b=document.createElement('button');b.id='seiMapsSetupBtn';b.className='btn';b.textContent='Google Maps Setup';b.onclick=configureMaps;
      document.querySelector('.admin-hero-actions').appendChild(b);
    }
  };

  window.seiOpenProgramCalendar=(p)=>showCalendarActions(p);
})();
</script>
