async function api(path,opts={},retry=true){
 const headers=Object.assign({'apikey':SUPABASE_ANON,'Accept':'application/json'},opts.headers||{});
 if(state.token)headers.Authorization='Bearer '+state.token;
 const res=await fetch(SUPABASE_URL+path,Object.assign({headers},opts));
 if(res.status===401&&retry&&state.refresh){if(await refreshToken())return api(path,opts,false)}
 const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch{}
 if(!res.ok)throw new Error(data?.message||data?.error_description||data?.error||text||res.statusText);
 return data;
}

}

function openProgram(code=''){if(!state.admin)return toast('Admin sign-in required','bad');const r=code?state.rows.find(x=>x.code===code):null;const next=Math.max(0,...state.rows.map(x=>Number((String(x.code).match(/\\d+/)||[0])[0])))+1;openModal('<h2>'+ (r?'Edit program':'Add program') +'</h2><div class="section-note">Changes are written directly to Supabase.</div><form class="form" id="programForm"><div class="field"><label>Program ID</label><input id="pCode" value="'+esc(r?.code||'PRG '+pad(next))+'" '+(r?'readonly':'')+' required></div><div class="field"><label>Date</label><input id="pDate" type="date" value="'+esc(r?.date||today())+'" required></div><div class="field"><label>Event type</label><input id="pEvent" value="'+esc(r?.event||'')+'" placeholder="Wedding" required></div><div class="field"><label>Place</label><input id="pPlace" value="'+esc(r?.place||'')+'" placeholder="Iringallur" required></div><div class="field"><label>Program type</label><input id="pType" value="'+esc(r?.type||'')+'" placeholder="Muttippattu" required></div><div class="field"><label>Booking source</label><input id="pSource" value="'+esc(r?.source||'Direct_Call')+'" required></div><div class="field"><label>Income (₹)</label><input id="pIncome" type="number" min="0" value="'+(r?.income??0)+'" required></div><div class="field"><label>Expense (₹)</label><input id="pExpense" type="number" min="0" value="'+(r?.expense??0)+'"></div><div class="field"><label>Advance received (₹)</label><input id="pAdvance" type="number" min="0" value="'+(r?.advance??0)+'"></div><div class="field"><label>Status</label><select id="pStatus"><option value="enquiry">Enquiry</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="field"><label>Contact name</label><input id="pName" value="'+esc(r?.name||'')+'"></div><div class="field"><label>Contact phone</label><input id="pPhone" value="'+esc(r?.contact_phone||r?.phone||'')+'" type="tel"></div><div class="field wide"><label>Notes</label><textarea id="pNotes">'+esc(r?.notes||'')+'</textarea></div><div class="form-error" id="programError"></div></form><div class="dialog-actions"><button class="button" id="programCancel">Cancel</button><button class="button primary" id="programSave">'+(r?'Save changes':'Save program')+'</button></div>');$('pStatus').value=r?.st||'confirmed';$('programCancel').onclick=closeModal;$('programSave').onclick=()=>saveProgram(code)}
async function saveProgram(editCode){if(!state.admin)return toast('Admin sign-in required','bad');const get=id=>$(id).value.trim(),income=+get('pIncome'),expense=+get('pExpense')||0,advance=+get('pAdvance')||0;if(!get('pCode')||!get('pDate')||!get('pEvent')||!get('pPlace')||!get('pType'))return $('programError').textContent='Complete Program ID, date, event, place and program type.';if(!Number.isFinite(income)||income<0||expense<0||advance<0)return $('programError').textContent='Income, expense and advance must be valid non-negative numbers.';if(advance>income)return $('programError').textContent='Advance cannot be greater than income.';const payload={program_code:get('pCode'),program_date:get('pDate'),event_type:get('pEvent'),place:get('pPlace'),program_type:get('pType'),booking_source:get('pSource'),income,expense,program_status:$('pStatus').value,contact_name:get('pName')||null,contact_phone:get('pPhone')||null,advance_received:advance,balance_to_collect:Math.max(income-advance,0),notes:get('pNotes')||null,updated_by:state.userId||null};$('programSave').disabled=true;try{if(editCode)await api('/rest/v1/programs?program_code=eq.'+encodeURIComponent(editCode),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});else await api('/rest/v1/programs',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});closeModal();toast(editCode?'Program updated ✓':'Program saved ✓');await load()}catch(e){$('programError').textContent=e.message;$('programSave').disabled=false}}
function openDelete(code){if(!state.admin)return;const r=state.rows.find(x=>x.code===code);if(!r)return;openModal('<h2>Are you sure to delete this event?</h2><div class="section-note" style="margin-top:5px">This permanently removes the record from Supabase.</div><div style="display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin-top:13px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#101217;font-size:10px"><span style="color:#7f8690">Program</span><b>'+esc(r.code)+'</b><span style="color:#7f8690">Event</span><b>'+esc(r.event)+'</b><span style="color:#7f8690">Place</span><b>'+esc(r.place)+'</b><span style="color:#7f8690">Date</span><b>'+fmtDateLong(r.date)+'</b></div><div class="dialog-actions"><button class="button" id="deleteCancel">No, keep it</button><button class="button danger" id="deleteYes">Yes, delete</button></div>');$('deleteCancel').onclick=closeModal;$('deleteYes').onclick=async()=>{const b=$('deleteYes');b.disabled=true;b.textContent='Deleting…';try{await api('/rest/v1/programs?program_code=eq.'+encodeURIComponent(code),{method:'DELETE',headers:{'Prefer':'return=minimal'}});closeModal();state.rows=state.rows.filter(x=>x.code!==code);localStorage.setItem('sada_last_programs',JSON.stringify(state.rows));render();toast('Program deleted ✓')}catch(e){toast('Delete failed: '+e.message,'bad');b.disabled=false;b.textContent='Yes, delete'}}}
async function login(){const em=$('loginEmail').value.trim().toLowerCase(),pw=$('loginPassword').value;if(em!==ADMIN_EMAIL)return $('loginError').textContent='Admin access is restricted to the authorized account.';if(!pw)return $('loginError').textContent='Enter your password.';const b=$('loginButton');b.disabled=true;try{const res=await fetch(SUPABASE_URL+'/auth/v1/token',{method:'POST',headers:{apikey:SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});const d=await res.json();if(!res.ok)throw new Error(d.error_description||d.msg||'Sign in failed');state.token=d.access_token;state.refresh=d.refresh_token||'';state.userId=d.user?.id||'';state.admin=true;saveSession();toast('Signed in ✓');render();load()}catch(e){$('loginError').textContent=e.message}finally{b.disabled=false}}
async function logout(){state.admin=false;state.token='';state.refresh='';state.userId='';sessionStorage.removeItem('sada_admin_session');toast('Signed out ✓');render()}
function toast(msg,kind='ok'){const n=document.createElement('div');n.textContent=msg;n.style.cssText='position:fixed;right:15px;bottom:15px;z-index:200;padding:10px 13px;border:1px solid '+(kind==='bad'?'rgba(238,119,107,.35)':'rgba(223,187,112,.18)')+';border-radius:11px;background:#14171d;color:'+(kind==='bad'?'#f09a90':'#f0e2c3')+';font-size:10px;box-shadow:0 18px 45px rgba(0,0,0,.45)';document.body.appendChild(n);setTimeout(()=>n.remove(),3200)}
function drawTrendCanvas(canvas,a){if(!canvas)return;const box=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.max(300,box.width),h=Math.max(180,box.height);canvas.width=w*d;canvas.height=h*d;const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);const map={};a.filter(booked).forEach(r=>{const k=r.date.slice(0,7);map[k]=(map[k]||0)+r.income});const ks=Object.keys(map).sort();if(!ks.length)return;const max=Math.max(...ks.map(k=>map[k]),1),p={l:42,r:15,t:16,b:30},iw=w-p.l-p.r,ih=h-p.t-p.b;c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;for(let i=0;i<5;i++){const y=p.t+i*ih/4;c.beginPath();c.moveTo(p.l,y);c.lineTo(w-p.r,y);c.stroke()}const pts=ks.map((k,i)=>({x:p.l+(ks.length===1?iw/2:i*iw/(ks.length-1)),y:p.t+ih-(map[k]/max)*ih,k}));c.strokeStyle='#efc86f';c.lineWidth=3;c.lineCap='round';c.lineJoin='round';c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.stroke();c.fillStyle='#101217';c.strokeStyle='#efc86f';c.lineWidth=2;pts.forEach(q=>{c.beginPath();c.arc(q.x,q.y,4,0,Math.PI*2);c.fill();c.stroke()});c.fillStyle='#747c86';c.font='9px Inter';c.textAlign='center';ks.forEach((k,i)=>{if(i%Math.max(1,Math.ceil(ks.length/6))===0||i===ks.length-1)c.fillText(new Date(k+'-01T00:00:00').toLocaleDateString('en-US',{month:'short'}),pts[i].x,h-8)})}
function drawCharts(){const canvas=$('trend');if(canvas)drawTrendCanvas(canvas,filtered());const d=filtered(),mix={};d.filter(booked).forEach(r=>mix[r.type]=(mix[r.type]||0)+r.income);const rows=Object.entries(mix).sort((a,b)=>b[1]-a[1]),total=rows.reduce((s,x)=>s+x[1],0);if($('donut')){let a=0;const stops=rows.map(([,v],i)=>{const end=a+(total?v/total*360:0),col=['#efc86f','#96733b','#65502c','#3f3420'][i%4];const s=col+' '+a+'deg '+end+'deg';a=end;return s}).join(',')||'#3f3420 0deg 360deg';$('donut').style.background='conic-gradient('+stops+')';$('donutCenter').childNodes[0].nodeValue=total&&rows.length?Math.round(rows[0][1]/total*100)+'%':'0%';$('legend').innerHTML=rows.slice(0,5).map(([k,v])=>'<div class="legend-row"><span>'+esc(k)+'</span><b>'+money(v)+'</b></div>').join('')||'<div class="legend-row"><span>No data</span><b>—</b></div>'}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){state.view=b.dataset.view;state.tab='';render()}});
$('search').addEventListener('input',e=>{state.filters.q=e.target.value;render()});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){state.filters[e.target.dataset.filter]=e.target.value;render()}});
$('filterToggle').onclick=()=>{$('filters').style.display=$('filters').style.display==='none'?'flex':''};
$('addButton').onclick=()=>openProgram();
$('pageDate').textContent=fmtDateLong(today());
restoreSession();
render();
load();
setInterval(load,30000);
window.addEventListener('resize',()=>drawCharts());
</script>
