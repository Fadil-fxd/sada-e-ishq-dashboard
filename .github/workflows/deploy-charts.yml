name: Deploy chart enhancement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add enhancement script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="chart-enhancement.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\\n</body>')
              p.write_text(s)
          PY
      - name: Commit enhancement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable interactive charts'
          git push
